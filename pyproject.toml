[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-engine"
version = "0.1.0"
description = "A small LLM serving engine in PyTorch: a one-request-at-a-time baseline and iteration-level continuous batching, measured on GPT-2."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.9",
  "safetensors>=0.6",
  "tokenizers>=0.22",
  "huggingface-hub>=0.35",
  "fastapi>=0.120",
  "uvicorn>=0.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "httpx>=0.28",
  "transformers>=4.57",
  "ruff>=0.14",
  "mypy>=1.18",
  "pip-audit>=2.9",
]

[project.scripts]
lie = "llm_inference_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
addopts = "-p no:cacheprovider --basetemp=.tmp/pytest"

[tool.ruff]
line-length = 100
extend-exclude = [".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT", "RET", "PIE", "PERF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["src", "tests"]
cache_dir = ".tmp/mypy"

[[tool.mypy.overrides]]
module = ["transformers.*", "safetensors.*"]
ignore_missing_imports = true
